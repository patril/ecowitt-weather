name: Add wind to current weather

on:
  push:
    branches: [feature/sky-condition-graphic]
    paths:
      - scripts/add_wind_to_current_weather.py
      - .github/workflows/add-wind-to-current-weather.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sky-condition-graphic
      - run: python scripts/add_wind_to_current_weather.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grafana/dashboards/weather.json
          git commit -m "Make current weather scene wind-aware"
          git push
