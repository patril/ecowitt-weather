name: Fix sky panel spacing

on:
  push:
    branches: [feature/sky-condition-graphic]
    paths:
      - scripts/fix_sky_panel_spacing.py
      - .github/workflows/fix-sky-panel-spacing.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sky-condition-graphic
      - run: python scripts/fix_sky_panel_spacing.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grafana/dashboards/weather.json
          git commit -m "Fix sky condition panel spacing"
          git push
