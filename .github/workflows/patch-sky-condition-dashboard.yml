name: Patch sky condition dashboard

on:
  push:
    branches:
      - feature/sky-condition-graphic

permissions:
  contents: write

jobs:
  patch-dashboard:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch provisioned dashboard
        run: python scripts/patch_sky_condition_dashboard.py
      - name: Commit generated dashboard
        run: |
          if git diff --quiet -- grafana/dashboards/weather.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grafana/dashboards/weather.json
          git commit -m "Render sky condition as animated SVG [skip ci]"
          git push
