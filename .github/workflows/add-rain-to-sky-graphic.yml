name: Add rain to sky graphic

on:
  push:
    branches: [feature/sky-condition-graphic]
    paths:
      - scripts/add_rain_to_sky_graphic.py
      - .github/workflows/add-rain-to-sky-graphic.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sky-condition-graphic
      - run: python scripts/add_rain_to_sky_graphic.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grafana/dashboards/weather.json
          git commit -m "Visualize current rainfall intensity"
          git push
