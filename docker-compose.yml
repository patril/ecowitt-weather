services:
  postgres:
    image: postgres:16
    container_name: ecowitt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-weather}
      POSTGRES_USER: ${POSTGRES_USER:-weather}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=2MB
    volumes:
      - ${DATA_ROOT:?Set DATA_ROOT in .env}/postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-weather} -d ${POSTGRES_DB:-weather}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mock-gw3000:
    build:
      context: ./mock-gw3000
    container_name: ecowitt-mock-gw3000
    restart: unless-stopped
    # Exposing this port is useful for testing from the host with curl.
    ports:
      - "8081:8080"

  collector:
    build:
      context: ./collector
    container_name: ecowitt-collector
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mock-gw3000:
        condition: service_started
    environment:
      USE_MOCK_GW3000: ${USE_MOCK_GW3000:-false}
      ECOWITT_REAL_URL: ${ECOWITT_REAL_URL:-http://192.168.4.131/get_livedata_info}
      MOCK_GW3000_URL: http://mock-gw3000:8080/get_livedata_info
      POLL_SECONDS: ${POLL_SECONDS:-30}
      DATABASE_URL: postgresql://${POSTGRES_USER:-weather}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-weather}

  grafana:
    image: grafana/grafana:latest
    container_name: ecowitt-grafana
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-weather}
      POSTGRES_USER: ${POSTGRES_USER:-weather}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${DATA_ROOT:?Set DATA_ROOT in .env}/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
