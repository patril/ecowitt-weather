# Long-running services use `restart: unless-stopped` so Docker restores the
# weather stack automatically when the Docker daemon starts after a Pi reboot.
services:
  postgres:
    image: postgres:16
    container_name: ecowitt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-weather}
      POSTGRES_USER: ${POSTGRES_USER:-weather}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=2MB
      - -c
      - timezone=${STATION_TIMEZONE:-America/New_York}
    volumes:
      - ${DATA_ROOT:?Set DATA_ROOT in .env}/postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-weather} -d ${POSTGRES_DB:-weather}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mock-gw3000:
    build:
      context: ./mock-gw3000
    container_name: ecowitt-mock-gw3000
    restart: unless-stopped
    # Exposing this port is useful for testing from the host with curl.
    ports:
      - "8081:8080"

  collector:
    build:
      context: ./collector
    container_name: ecowitt-collector
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mock-gw3000:
        condition: service_started
    environment:
      USE_MOCK_GW3000: ${USE_MOCK_GW3000:-false}
      ECOWITT_REAL_URL: ${ECOWITT_REAL_URL:-http://192.168.4.131/get_livedata_info}
      MOCK_GW3000_URL: http://mock-gw3000:8080/get_livedata_info
      POLL_SECONDS: ${POLL_SECONDS:-30}
      STATION_TIMEZONE: ${STATION_TIMEZONE:-America/New_York}
      STATION_LATITUDE: ${STATION_LATITUDE:-}
      STATION_LONGITUDE: ${STATION_LONGITUDE:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-weather}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-weather}

  daily-energy-scheduler:
    build:
      context: ./collector
    container_name: ecowitt-daily-energy-scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: ["/app/cron-entrypoint.sh"]
    environment:
      STATION_TIMEZONE: ${STATION_TIMEZONE:-America/New_York}
      DAILY_ENERGY_MAX_GAP_SECONDS: ${DAILY_ENERGY_MAX_GAP_SECONDS:-300}
      DATABASE_URL: postgresql://${POSTGRES_USER:-weather}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-weather}

  grafana:
    build:
      context: ./grafana
    container_name: ecowitt-grafana
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_NAME: "Main Org."
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SERVER_DOMAIN: weather.local
      GF_SERVER_ROOT_URL: http://weather.local/
      POSTGRES_DB: ${POSTGRES_DB:-weather}
      POSTGRES_USER: ${POSTGRES_USER:-weather}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${DATA_ROOT:?Set DATA_ROOT in .env}/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: ecowitt-nginx
    restart: unless-stopped
    depends_on:
      - grafana
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
